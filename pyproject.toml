[project]
name = "digifort_cftv_monitor"
version = "0.1.0"
description = "Auditoria automatizada de telemetria e retencao CFTV Digifort Enterprise com CrewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,litellm]>=1.15.44,<2.0.0",
    "litellm>=1.105.3",
    "openai>=2.54.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "aeb6e5f3-1150-4842-8340-9cf2cb4df580"
